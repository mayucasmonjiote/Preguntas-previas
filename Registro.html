<script>(function scriptFormulario(CFG) {

  const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
  const codigo = (new URLSearchParams(location.hash.slice(1)).get('c') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');

  const campo = ([c, l, t, ops, req]) => {
    const lab = `<span>${esc(l)} ${req ? '<b>*</b>' : ''}</span>`;
    if (t === 'select') return `<label class="f">${lab}<select name="${c}"><option value="">Elige una opción</option>${ops.map(o => `<option>${esc(o)}</option>`).join('')}</select></label>`;

  };

   ${codigo ? '' : '<div class="aviso warn">Este enlace no trae tu código personal. Puedes llenarlo, pero es mejor usar el enlace exacto que te enviaron.</div>'}

   <form id="f" autocomplete="on" novalidate>
    <div class="card"><h2>1. Aviso de privacidad</h2>${verDoc('aviso')}

    <div class="card"><h2>Consentimiento informado</h2>${verDoc('consentimiento', true)}
     <label class="check"><input type="checkbox" name="acCons"> <span>Leí el consentimiento informado, tuve oportunidad de preguntar y acepto iniciar el proceso en esos términos. *</span></label>
     <label class="check"><input type="checkbox" name="acCanc"> <span>Acepto la política de cancelaciones (sección E). *</span></label></div>
    <div class="card"><h2>Datos sensibles</h2>${verDoc('constancia', true)}
     <label class="check"><input type="checkbox" name="P3" value="Sí"> <span>Otorgo mi consentimiento expreso para el tratamiento de mis datos personales sensibles, en particular los de salud física y mental, para las finalidades del aviso de privacidad. *</span></label></div>
    <div class="card"><h2>Firma</h2>
     <label class="f"><span>Escribe tu nombre completo como firma <b>*</b></span><input type="text" name="P4" autocomplete="name"></label>
     <p class="small muted">Opcional: dibuja tu firma con el dedo o el mouse.</p><canvas id="lienzo" width="600" height="150" aria-label="Espacio para dibujar tu firma"></canvas>
     <button type="button" class="btn" id="borrarFirma">Borrar dibujo</button>
     <p class="small muted">Al continuar se registran tu nombre escrito, la fecha y la hora de este dispositivo y la versión de cada documento que aceptaste.</p></div>
    <div id="errores"></div>
    <button type="submit" class="btn primary grande">Firmar y preparar mi respuesta</button>
   </form>
   <div id="listo" class="card oculto"></div>`;
  const idNom = CFG.idNombre || 'A1', idNac = CFG.idNac || 'A3';
  const nacIn = document.querySelector(`[name="${idNac}"]`);
  if (nacIn) nacIn.addEventListener('input', () => { const e = nacIn.value ? edad(nacIn.value) : ''; document.querySelectorAll('[data-edad]').forEach(x => { x.value = e === '' || isNaN(e) ? '' : e + ' años'; }); });
  const cv = $('#lienzo'), cx = cv.getContext('2d'); let trazo = false, dibujado = false;
  cx.lineWidth = 2.5; cx.lineCap = 'round'; cx.strokeStyle = '#111';
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };

  ['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, () => { trazo = false; }));
  $('#borrarFirma').onclick = () => { cx.clearRect(0, 0, cv.width, cv.height); dibujado = false; };
  const edad = iso => { const [y, m, d] = iso.split('-').map(Number); const h = new Date(); let e = h.getFullYear() - y; if (h.getMonth() + 1 < m || (h.getMonth() + 1 === m && h.getDate() < d)) e--; return e; };
  const b64url = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
  async function cifrar(obj) {
    const pub = await crypto.subtle.importKey('jwk', CFG.publica, { name: 'ECDH', namedCurve: 'P-256' }, false, []);
    const eph = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'ECDH', public: pub }, eph.privateKey, 256);
    const hk = await crypto.subtle.importKey('raw', bits, 'HKDF', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(32), info: TE.encode('expedientes-respuesta-1') }, hk, { name: 'AES-GCM', length: 256 }, false, ['encrypt']);
    let datos = TE.encode(JSON.stringify(obj)), modo = 2;
    if (window.CompressionStream) { datos = new Uint8Array(await new Response(new Blob([datos]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer()); modo = 1; }
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, datos));
    const ep = new Uint8Array(await crypto.subtle.exportKey('raw', eph.publicKey));
    const out = new Uint8Array(1 + ep.length + 12 + ct.length); out[0] = modo; out.set(ep, 1); out.set(iv, 1 + ep.length); out.set(ct, 1 + ep.length + 12);
    return 'EXPRESP1.' + b64url(out);
  }
  $('#f').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target, v = {}, err = [];
    new FormData(f).forEach((x, k) => { v[k] = typeof x === 'string' ? x.trim() : x; });
    if (v.P1 === 'No') { $('#errores').innerHTML = '<div class="aviso danger">Este servicio atiende solo a personas adultas. Por favor, comunícate con tu psicoterapeuta para recibir orientación.</div>'; return; }
    if (v.P1 !== 'Sí') err.push('Indica si tienes 18 años cumplidos.');

    if (!v.P4) err.push('Escribe tu nombre completo como firma.');

    let firma = null; if (dibujado) { const c2 = document.createElement('canvas'); c2.width = 300; c2.height = 75; c2.getContext('2d').drawImage(cv, 0, 0, 300, 75); firma = c2.toDataURL('image/png'); }
    const obj = { formato: 'expedientes-respuesta', version: 1, codigo, generadoFormulario: CFG.generado, respuestas, definicion: CFG.definicion || null,
      aceptacion: { documentos: CFG.docs.map(({ id, titulo, version, hash }) => ({ id, titulo, version, hash })), aviso: true, consentimiento: true, politicaCancelacion: true, constancia: true,
        nombreEscrito: v.P4, firmaImagen: firma, fechaDispositivo: ahora.toISOString(), fechaLocal: ahora.toLocaleString('es-MX'), zonaHoraria: (Intl.DateTimeFormat().resolvedOptions().timeZone || ''), navegador: navigator.userAgent, abiertoDesde: abierto } };
    let texto;
    try { texto = await cifrar(obj); } catch (x) { $('#errores').innerHTML = '<div class="aviso danger">Tu navegador no pudo cifrar la respuesta. Abre el enlace con Chrome o Safari actualizados.</div>'; return; }
    const archivo = new File([texto], `respuesta-registro-${respuestas.P5}.exprespuesta`, { type: 'text/plain' });
    f.classList.add('oculto');
    const L = $('#listo'); L.classList.remove('oculto');
    L.innerHTML = `<h2>¡Listo! Ahora envía tu respuesta</h2><p>Está cifrada: nadie más puede leerla, ni siquiera WhatsApp o tu servicio de correo.</p>
     ${navigator.share ? '<button class="btn primary grande" id="compartir">Enviar por WhatsApp o correo</button>' : ''}

})({"publica":{"crv":"P-256","ext":true,"key_ops":[],"kty":"EC","x":"QPqTl4QSHTwv3oVT2EqqZfKlsORei7IKHKdz70SWq8k","y":"sij1-CIvvElvfzsrtac1690vORES3R_nSzjFh-8wEtk"},"profesional":"Mariana Pérez Monjiote","generado":"2026-11-24T18:58:28.977Z","docs":[{"id":"aviso","titulo":"Aviso de privacidad integral","version":1,"md":"# Aviso de privacidad integral\n\n**1. Responsable.** Mariana Pérez Monjiote, con domicilio en Calle 2 a 509 cortés sarmiento, es responsable del tratamiento de tus datos personales. Para cualquier asunto relacionado con este aviso puedes escribir a mayucasmonjiote@gmail.com.\n\n**2. Datos personales que trato.**\n\n- De identificación: nombre, nombre preferido, fecha de nacimiento, sexo, pronombres, ocupación, escolaridad y estado civil.\n- De contacto: teléfono, correo electrónico y ciudad de residencia.\n- De tu contacto de emergencia: nombre, relación contigo y teléfono.\n- Administrativos: fechas de consulta, asistencias, cancelaciones, pagos y, si solicitas comprobante fiscal, tus datos fiscales.\n- **Datos personales sensibles:** información sobre tu estado de salud física y mental, como motivo de consulta, antecedentes de atención psicológica o psiquiátrica, medicación, historia clínica, notas de evolución y cualquier otro dato íntimo que compartas en sesión.\n\n**3. Finalidades.** Uso tus datos únicamente para finalidades necesarias para la atención:\n\n1. Valorar tu solicitud y agendar la primera consulta.\n2. Brindarte atención psicoterapéutica.\n3. Integrar y conservar tu expediente clínico conforme a la NOM-004-SSA3-2012.\n4. Comunicarme contigo sobre tus citas.\n5. Llevar el registro administrativo de consultas, cancelaciones y pagos, y emitir comprobantes fiscales si los solicitas.\n6. Contactar a tu contacto de emergencia solo en una situación de riesgo.\n7. Cumplir obligaciones legales y atender requerimientos de autoridad competente.\n\nNo trato tus datos para finalidades secundarias como publicidad o mercadotecnia.\n\n**4. Consentimiento.** Para tratar tus datos sensibles necesito tu consentimiento expreso y por escrito. Lo otorgas en el formulario de registro y lo ratificas con tu firma en la primera consulta.\n\n**5. Con quién se comparten.**\n\n- Servicios tecnológicos que solo reciben información cifrada que no pueden leer: CryptPad, para el formulario de registro, y [[Falta: Servicio de nube para respaldos]], para copias de respaldo cifradas.\n- No transfiero tus datos a terceros sin tu consentimiento, salvo en los casos que la ley permite sin él, por ejemplo por mandato de autoridad competente o cuando sea necesario para tu atención médica.\n- Si quieres que comparta información con otro profesional de la salud, lo haré solo con tu autorización por escrito.\n\n**6. Cómo protejo tus datos.** Tu expediente se guarda cifrado en un equipo de uso exclusivo de la psicoterapeuta, con contraseña, y los respaldos también están cifrados. Solo yo tengo acceso.\n\n**7. Cuánto tiempo los conservo.** El expediente clínico se conserva al menos cinco años después de la última atención. Después se bloquea durante [[Falta: Plazo de bloqueo]] y luego se elimina de forma segura. Si llenas el formulario pero no inicias la atención, tus datos se eliminan a los [[Falta: Meses para eliminar registros no iniciados]] meses.\n\n**8. Cómo limitar el uso o divulgación.** Puedes pedirme por escrito en mayucasmonjiote@gmail.com que limite cómo te contacto o qué información comparto, por ejemplo que no te deje mensajes.\n\n**9. Tus derechos ARCO y revocación.** Puedes acceder a tus datos, rectificarlos, cancelarlos u oponerte a su uso, y revocar tu consentimiento, enviándome una solicitud a mayucasmonjiote@gmail.com o entregándola por escrito en el consultorio. La solicitud debe incluir tu nombre y un domicilio o medio para responderte; copia de una identificación oficial o, si la presenta un representante, el documento que acredite su representación; el derecho que quieres ejercer y la descripción clara de los datos; y cualquier dato que ayude a localizarlos.\n\nTe responderé en un plazo máximo de 20 días desde que reciba tu solicitud, por el mismo medio, y si procede la haré efectiva dentro de los 15 días siguientes. Estos plazos pueden ampliarse una sola vez por un periodo igual cuando se justifique. El trámite es gratuito; solo podrían cobrarse costos de reproducción o envío.\n\nTen en cuenta que la ley obliga a conservar el expediente clínico durante el plazo indicado, por lo que no puede eliminarse antes, y que las notas clínicas no se modifican: las correcciones se agregan como adendas fechadas.\n\n**10. Cambios a este aviso.** Cualquier cambio se publicará en [[Falta: Enlace al aviso integral]] y te lo informaré en la siguiente consulta.\n\n**11. Autoridad.** Si consideras que tus derechos no fueron atendidos, puedes acudir a la Secretaría Anticorrupción y Buen Gobierno, autoridad en materia de protección de datos personales en posesión de particulares.\n\nÚltima actualización: 12/11/2026","hash":"fd839f3f933ed9d4cc35e6c0318c3044efed6c8afbe757ef876422152155c3c6","html":"\u003ch1>Aviso de privacidad integral\u003c/h1>\n\u003cp>\u003cb>1. Responsable.\u003c/b> Mariana Pérez Monjiote, con domicilio en Calle 2 a 509 cortés sarmiento, es responsable del tratamiento de tus datos personales. Para cualquier asunto relacionado con este aviso puedes escribir a mayucasmonjiote@gmail.com.\u003c/p>\n\u003cp>\u003cb>2. Datos personales que trato.\u003c/b>\u003c/p>\n\u003cul>\u003cli>De identificación: nombre, nombre preferido, fecha de nacimiento, sexo, pronombres, ocupación, escolaridad y estado civil.\u003c/li>\u003cli>De contacto: teléfono, correo electrónico y ciudad de residencia.\u003c/li>\u003cli>De tu contacto de emergencia: nombre, relación contigo y teléfono.\u003c/li>\u003cli>Administrativos: fechas de consulta, asistencias, cancelaciones, pagos y, si solicitas comprobante fiscal, tus datos fiscales.\u003c/li>\u003cli>\u003cb>Datos personales sensibles:\u003c/b> información sobre tu estado de salud física y mental, como motivo de consulta, antecedentes de atención psicológica o psiquiátrica, medicación, historia clínica, notas de evolución y cualquier otro dato íntimo que compartas en sesión.\u003c/li>\u003c/ul>\n\u003cp>\u003cb>3. Finalidades.\u003c/b> Uso tus datos únicamente para finalidades necesarias para la atención:\u003c/p>\n\u003col>\u003cli>Valorar tu solicitud y agendar la primera consulta.\u003c/li>\u003cli>Brindarte atención psicoterapéutica.\u003c/li>\u003cli>Integrar y conservar tu expediente clínico conforme a la NOM-004-SSA3-2012.\u003c/li>\u003cli>Comunicarme contigo sobre tus citas.\u003c/li>\u003cli>Llevar el registro administrativo de consultas, cancelaciones y pagos, y emitir comprobantes fiscales si los solicitas.\u003c/li>\u003cli>Contactar a tu contacto de emergencia solo en una situación de riesgo.\u003c/li>\u003cli>Cumplir obligaciones legales y atender requerimientos de autoridad competente.\u003c/li>\u003c/ol>\n\u003cp>No trato tus datos para finalidades secundarias como publicidad o mercadotecnia.\u003c/p>\n\u003cp>\u003cb>4. Consentimiento.\u003c/b> Para tratar tus datos sensibles necesito tu consentimiento expreso y por escrito. Lo otorgas en el formulario de registro y lo ratificas con tu firma en la primera consulta.\u003c/p>\n\u003cp>\u003cb>5. Con quién se comparten.\u003c/b>\u003c/p>\n\u003cul>\u003cli>Servicios tecnológicos que solo reciben información cifrada que no pueden leer: CryptPad, para el formulario de registro, y \u003cspan class=\"ph\">[Servicio de nube para respaldos]\u003c/span>, para copias de respaldo cifradas.\u003c/li>\u003cli>No transfiero tus datos a terceros sin tu consentimiento, salvo en los casos que la ley permite sin él, por ejemplo por mandato de autoridad competente o cuando sea necesario para tu atención médica.\u003c/li>\u003cli>Si quieres que comparta información con otro profesional de la salud, lo haré solo con tu autorización por escrito.\u003c/li>\u003c/ul>\n\u003cp>\u003cb>6. Cómo protejo tus datos.\u003c/b> Tu expediente se guarda cifrado en un equipo de uso exclusivo de la psicoterapeuta, con contraseña, y los respaldos también están cifrados. Solo yo tengo acceso.\u003c/p>\n\u003cp>\u003cb>7. Cuánto tiempo los conservo.\u003c/b> El expediente clínico se conserva al menos cinco años después de la última atención. Después se bloquea durante \u003cspan class=\"ph\">[Plazo de bloqueo]\u003c/span> y luego se elimina de forma segura. Si llenas el formulario pero no inicias la atención, tus datos se eliminan a los \u003cspan class=\"ph\">[Meses para eliminar registros no iniciados]\u003c/span> meses.\u003c/p>\n\u003cp>\u003cb>8. Cómo limitar el uso o divulgación.\u003c/b> Puedes pedirme por escrito en mayucasmonjiote@gmail.com que limite cómo te contacto o qué información comparto, por ejemplo que no te deje mensajes.\u003c/p>\n\u003cp>\u003cb>9. Tus derechos ARCO y revocación.\u003c/b> Puedes acceder a tus datos, rectificarlos, cancelarlos u oponerte a su uso, y revocar tu consentimiento, enviándome una solicitud a mayucasmonjiote@gmail.com o entregándola por escrito en el consultorio. La solicitud debe incluir tu nombre y un domicilio o medio para responderte; copia de una identificación oficial o, si la presenta un representante, el documento que acredite su representación; el derecho que quieres ejercer y la descripción clara de los datos; y cualquier dato que ayude a localizarlos.\u003c/p>\n\u003cp>Te responderé en un plazo máximo de 20 días desde que reciba tu solicitud, por el mismo medio, y si procede la haré efectiva dentro de los 15 días siguientes. Estos plazos pueden ampliarse una sola vez por un periodo igual cuando se justifique. El trámite es gratuito; solo podrían cobrarse costos de reproducción o envío.\u003c/p>\n\u003cp>Ten en cuenta que la ley obliga a conservar el expediente clínico durante el plazo indicado, por lo que no puede eliminarse antes, y que las notas clínicas no se modifican: las correcciones se agregan como adendas fechadas.\u003c/p>\n\u003cp>\u003cb>10. Cambios a este aviso.\u003c/b> Cualquier cambio se publicará en \u003cspan class=\"ph\">[Enlace al aviso integral]\u003c/span> y te lo informaré en la siguiente consulta.\u003c/p>\n\u003cp>\u003cb>11. Autoridad.\u003c/b> Si consideras que tus derechos no fueron atendidos, puedes acudir a la Secretaría Anticorrupción y Buen Gobierno, autoridad en materia de protección de datos personales en posesión de particulares.\u003c/p>\n\u003cp>Última actualización: 12/11/2026\u003c/p>"},{"id":"consentimiento","titulo":"Consentimiento informado y acuerdos terapéuticos","version":1,"md":"# Consentimiento informado y acuerdos terapéuticos\n\n## A. Identificación de las partes\n\n| Psicoterapeuta | Mariana Pérez Monjiote |\n| Cédula profesional | 000111122 |\n| Domicilio del consultorio | Calle 2 a 509 cortés sarmiento |\n| Teléfono y correo profesional | 9999652414 / mayucasmonjiote@gmail.com |\n| Persona que recibe la atención | [tu nombre completo, como lo escribas al firmar] |\n| Número de expediente | [se asigna al registrarte] |\n| Fecha de elaboración | 24/11/2026 |\n\nEn este documento, «la psicoterapeuta» se refiere a la profesional identificada arriba y «tú» a la persona que recibe la atención.\n\n## B. Naturaleza del servicio\n\nLa psicoterapia es un proceso profesional en el que, a través de la conversación y de técnicas basadas en humanista, trabajamos sobre las situaciones que te traen a consulta.\n\n- **Objetivos.** En las primeras sesiones conoceremos tu situación y definiremos juntos los objetivos del proceso. Los revisaremos periódicamente y podemos ajustarlos.\n- **Alcances.** La psicoterapia no sustituye la atención médica ni psiquiátrica. Si considero que necesitas otro tipo de atención, o que tu situación excede mi ámbito de competencia, te lo diré y te orientaré para buscarla.\n- **Tu participación.** El proceso requiere tu participación activa: asistir a las sesiones, compartir lo que consideres importante y, cuando lo acordemos, trabajar entre sesiones.\n- **Sin garantía de resultados.** Cada proceso es distinto y no es posible garantizar resultados específicos. Es normal que en algunos momentos aparezcan emociones incómodas al abordar temas difíciles; podemos hablar de ello en sesión.\n- **No es un servicio de emergencias.** Entre sesiones no puedo atender crisis. En una emergencia llama al 911 o acude al servicio de urgencias más cercano.\n- **Comunicación entre sesiones.** Usaremos Whatsapp solo para temas de agenda; los temas personales los trabajamos en sesión.\n- **Conclusión del proceso.** Cualquiera de las dos partes puede darlo por terminado. Recomiendo una sesión de cierre para revisar lo trabajado.\n\n## C. Confidencialidad y sus límites\n\nLo que compartes en sesión y lo que registro en tu expediente es confidencial y está protegido por el secreto profesional. Tu expediente se guarda cifrado y solo yo tengo acceso a él. La confidencialidad, sin embargo, no es absoluta: la ley y la ética profesional establecen excepciones. Podré compartir información sobre ti únicamente en estos casos:\n\n1. **Con tu autorización por escrito**, a la persona o institución que tú indiques (por ejemplo, tu médico o psiquiatra).\n2. **Riesgo grave para la vida.** Si existe un riesgo serio e inminente para tu vida o integridad, o para la de otra persona, podré tomar las medidas necesarias para proteger la vida, incluido comunicarme con tu contacto de emergencia o con servicios de emergencia.\n3. **Violencia contra niñas, niños o adolescentes.** Si me entero de que una persona menor de edad sufre o ha sufrido violación de sus derechos o violencia, la ley obliga a toda persona a hacerlo del conocimiento inmediato de las autoridades competentes.\n4. **Requerimiento de autoridad.** Cuando una autoridad judicial o administrativa competente lo ordene mediante un mandato fundado y motivado. Si soy citada a declarar en un procedimiento penal, la ley reconoce el deber de secreto de las y los psicólogos y lo haré valer, salvo que tú me liberes de él.\n5. **Otras obligaciones legales** de informar que resulten aplicables.\n6. \n\nEn todos los casos compartiré solo la información indispensable y, cuando sea posible, te lo informaré antes. Si nos encontramos fuera del consultorio, no te saludaré primero, para proteger tu privacidad; tú decides si quieres saludarme.\n\n## D. Condiciones de las consultas\n\n| Duración de cada sesión | 1 hora |\n| Frecuencia | mensual |\n| Modalidad | presencial |\n| Costo por sesión | el que acordemos antes de la primera sesión, que quedará anotado en tu expediente |\n| Métodos de pago | efectivo/transferencia |\n| Momento del pago | pevio a la cita |\n| Comprobante fiscal | PEMM010408IL |\n| Días y horario de atención | Lunes a Viernes |\n| Cómo solicitar un cambio de horario | Whatsapp |\n| Llegadas tarde | [[Falta: Llegadas tarde]] |\n| Ajustes de costo | [[Falta: Ajustes de costo]] |\n\n## E. Política de cancelaciones y reprogramaciones\n\nSi necesitas cancelar una consulta, avísame con un mínimo de 24 horas de anticipación por Whatsapp. Las 24 horas se cuentan desde que recibo tu aviso hasta la hora de inicio programada de la consulta.\n\n**Cancelaciones con 24 horas o más de anticipación:** no generan ningún cargo.\n\n**Cancelaciones con menos de 24 horas de anticipación (cancelación tardía):**\n\n| Cancelación tardía | Cargo |\n|---|---|\n| Primera | 50% del costo de la consulta |\n| Segunda | 100% del costo de la consulta |\n| Tercera y siguientes | 100% del costo de la consulta |\n\n- El conteo de cancelaciones tardías se reinicia al cerrar tu proceso terapéutico. Si más adelante inicias un proceso nuevo, el conteo empieza desde cero.\n- **Reprogramaciones con menos de 24 horas:** si me pides cambiar una consulta con menos de 24 horas de anticipación, valoraré cada caso y te diré, antes de confirmar la nueva fecha, si cuenta como cancelación tardía.\n- **Pago del cargo:** Posterior a un cambio en la cita dentro de las 24 horas de confirmación\n- **Situaciones extraordinarias:** [[Falta: Situaciones extraordinarias]] Fuera de lo que se describe aquí, no hay excepciones automáticas.\n- Reagenda inmediata\n\nIniciales de aceptación de esta política: ____________\n\n## F. Inasistencias\n\nUna inasistencia no es lo mismo que una cancelación tardía. Hay inasistencia cuando no te presentas a la consulta sin haber avisado antes de la hora de inicio. Un aviso dado con menos de 24 horas, pero antes de la hora de inicio, es una cancelación tardía y se rige por la sección E.\n\n**Política de inasistencias:** [[Falta: Política de inasistencias]]\n\n## G. Atención en línea\n\n- **Plataforma:** las sesiones se realizan por google meet; te enviaré el enlace por Whatsapp.\n- **Privacidad del espacio:** conéctate desde un lugar privado donde nadie pueda escuchar, de preferencia con audífonos. Yo haré lo mismo.\n- **Ubicación:** al inicio de cada sesión te preguntaré en qué lugar te encuentras, para poder pedir ayuda en caso de emergencia.\n- **Grabaciones:** ninguna de las dos partes grabará las sesiones sin autorización previa y por escrito de la otra.\n- **Conexión:** procura una conexión estable. Si la llamada se corta, intentaré reconectar y, si no es posible, te llamaré al teléfono registrado. Si no se restablece en 10 minutos: se reagenda\n- **Interrupciones:** si alguien entra al espacio o hay una interrupción, podemos pausar la sesión.\n- **Seguridad:** no tomes la sesión mientras manejas o realizas otra actividad que requiera tu atención.\n- **Límites:** si considero que la modalidad en línea no es adecuada para tu situación, te propondré sesiones presenciales u otra alternativa.\n\n## H. Tus derechos\n\n- Recibir información clara sobre el proceso, sus objetivos, la forma de trabajo y los costos.\n- Hacer preguntas en cualquier momento.\n- Expresar dudas o desacuerdos sin que eso afecte la atención que recibes.\n- Solicitar información sobre cómo trato tus datos personales y ejercer tus derechos de acceso, rectificación, cancelación y oposición, como explica el aviso de privacidad.\n- Retirar tu consentimiento. Para el tratamiento de tus datos, la revocación no tiene efectos hacia atrás. Tu expediente debe conservarse al menos cinco años después de la última atención, por lo que retirar el consentimiento no implica borrarlo antes de ese plazo.\n- Interrumpir el proceso en cualquier momento. Los cargos ya generados conforme a la sección E se mantienen.\n- Solicitar por escrito un resumen clínico.\n- Pedir que te recomiende a otra u otro profesional.\n- Recibir un trato digno, respetuoso y sin discriminación.\n\n## I. Aceptación y firmas\n\nDeclaro que leí este documento, que me fue explicado, que tuve oportunidad de hacer preguntas y que acepto iniciar el proceso psicoterapéutico en los términos aquí descritos, incluida la política de cancelaciones. Recibí una copia de este documento.\n\n**Firma electrónica.** Se registra al final de este formulario con tu nombre escrito, la fecha y la hora de tu aceptación.\n\nNo aplica: el registro a distancia es solo para personas adultas.\n\nExpediente [se asigna al registrarte]. Documento generado el 24/11/2026 12:58.","hash":"c9b9b40182ea9fb75505f84c18c8334e5349911629e00d30864be57068f7d455","html":"\u003ch1>Consentimiento informado y acuerdos terapéuticos\u003c/h1>\n\u003ch2>A. Identificación de las partes\u003c/h2>\n\u003ctable>\u003ctr>\u003cth>Psicoterapeuta\u003c/th>\u003ctd>Mariana Pérez Monjiote\u003c/td>\u003c/tr>\u003ctr>\u003cth>Cédula profesional\u003c/th>\u003ctd>000111122\u003c/td>\u003c/tr>\u003ctr>\u003cth>Domicilio del consultorio\u003c/th>\u003ctd>Calle 2 a 509 cortés sarmiento\u003c/td>\u003c/tr>\u003ctr>\u003cth>Teléfono y correo profesional\u003c/th>\u003ctd>9999652414 / mayucasmonjiote@gmail.com\u003c/td>\u003c/tr>\u003ctr>\u003cth>Persona que recibe la atención\u003c/th>\u003ctd>[tu nombre completo, como lo escribas al firmar]\u003c/td>\u003c/tr>\u003ctr>\u003cth>Número d abajado.\u003c/li>\u003c/ul>\n\u003ch2>C. Confidencialidad y sus límites\u003c/h2>\n\u003cp>Lo que compartes en sesión y lo que registro en tu expediente es confidencial y está protegido por el secreto profesional. Tu expediente se guarda cifrado y solo yo tengo acceso a él. La confidencialidad, sin embargo, no es absoluta: la ley y la ética profesional establecen excepciones. Podré compartir información sobre ti únicamente en estos casos:\u003c/p>\n\u003col>\u003cli>\u003cb>Con tu autorización por escrito\u003c/b>, a la persona o institución que tú indiques (por ejemplo, tu médico o psiquiatra).\u003c/li>\u003cli>\u003cb>Riesgo grave para la vida.\u003c/b> Si existe un riesgo serio e inminente para tu vida o integridad, o para la de otra persona, podré tomar las medidas necesarias para proteger la vida, incluido comunicarme con tu contacto de emergencia o con servicios de emergencia.\u003c/li>\u003cli>\u003cb>Violencia contra niñas, niños o adolescentes.\u003c/b> Si me entero de que una persona menor de edad sufre o ha sufrido violación de sus derechos o violencia, la ley obliga a toda persona a hacerlo del conocimiento inmediato de las autoridades competentes.\u003c/li>\u003cli>\u003cb>Requerimiento de autoridad.\u003c/b> Cuando una autoridad judicial o administrativa competente lo ordene mediante un mandato fundado y motivado. Si soy citada a declarar en un procedimiento penal, la ley reconoce el deber de secreto de las y los psicólogos y lo haré valer, salvo que tú me liberes de él.\u003c/li>\u003cli>\u003cb>Otras obligaciones legales\u003c/b> de informar que resulten aplicables.\u003c/li>\u003c/ol>\n\u003cp>En todos los casos compartiré solo la información indispensable y, cuando sea posible, te lo informaré antes. Si nos encontramos fuera del consultorio, no te saludaré primero, para proteger tu privacidad; tú decides si quieres saludarme.\u003c/p>\n\u003ch2>D. Condiciones de las consultas\u003c/h2>\n\u003ctable>\u003ctr>\u003cth>Duración de cada sesión\u003c/th>\u003ctd>1 hora\u003c/td>\u003c/tr>\u003ctr>\u003cth>Frecuencia\u003c/th>\u003ctd>mensual\u003c/td>\u003c/tr>\u003ctr>\u003cth>Modalidad\u003c/th>\u003ctd>presencial\u003c/td>\u003c/tr>\u003ctr>\u003cth>Costo por sesión\u003c/th>\u003ctd>el que acordemos antes de la primera sesión, que quedará anotado en tu expediente\u003c/td>\u003c/tr>\u003ctr>\u003cth>Métodos de pago\u003c/th>\u003ctd>efectivo/transferencia\u003c/td>\u003c/tr>\u003ctr>\u003cth>Momento del pago\u003c/th>\u003ctd>pevio a la cita\u003c/td>\u003c/tr>\u003ctr>\u003cth>Comprobante fiscal\u003c/th>\u003ctd>PEMM010408IL\u003c/td>\u003c/tr>\u003ctr>\u003cth>Días y horario de atención\u003c/th>\u003ctd>Lunes a Viernes\u003c/td>\u003c/tr>\u003ctr>\u003cth>Cómo solicitar un cambio de horario\u003c/th>\u003ctd>Whatsapp\u003c/td>\u003c/tr>\u003ctr>\u003cth>Llegadas tarde\u003c/th>\u003ctd>\u003cspan class=\"ph\">[Llegadas tarde]\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003cth>Ajustes de costo\u003c/th>\u003ctd>\u003cspan class=\"ph\">[Ajustes de costo]\u003c/span>\u003c/td>\u003c/tr>\u003c/table>\n\u003ch2>E. Política de cancelaciones y reprogramaciones\u003c/h2>\n\u003cp>Si necesitas cancelar una consulta, avísame con un mínimo de 24 horas de anticipación por Whatsapp. Las 24 horas se cuentan desde que recibo tu aviso hasta la hora de inicio programada de la consulta.\u003c/p>\n\u003cp>\u003cb>Cancelaciones con 24 horas o más de anticipación:\u003c/b> no generan ningún cargo.\u003c/p>\n\u003cp>\u003cb>Cancelaciones con menos de 24 horas de anticipación (cancelación tardía):\u003c/b>\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Cancelación tardía\u003c/th>\u003cth>Cargo\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Primera\u003c/td>\u003ctd>50% del costo de la consulta\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Segunda\u003c/td>\u003ctd>100% del costo de la consulta\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tercera y siguientes\u003c/td>\u003ctd>100% del costo de la consulta\u003c/td>\u003c/tr>\u003c/table>\n\u003cul>\u003cli>El conteo de cancelaciones tardías se reinicia al cerrar tu proceso terapéutico. Si más adelante inicias un proceso nuevo, el conteo empieza desde cero.\u003c/li>\u003cli>\u003cb>Reprogramaciones con menos de 24 horas:\u003c/b> si me pides cambiar una consulta con menos de 24 horas de anticipación, valoraré cada caso y te diré, antes de confirmar la nueva fecha, si cuenta como cancelación tardía.\u003c/li>\u003cli>\u003cb>Pago del cargo:\u003c/b> Posterior a un cambio en la cita dentro de las 24 horas de confirmación\u003c/li>\u003cli>\u003cb>Situaciones extraordinarias:\u003c/b> \u003cspan class=\"ph\">[Situaciones extraordinarias]\u003c/span> Fuera de lo que se describe aquí, no hay excepciones automáticas.\u003c/li>\u003cli>Reagenda inmediata\u003c/li>\u003c/ul>\n\u003cp>Iniciales de aceptación de esta política: ____________\u003c/p>\n\u003ch2>F. Inasistencias\u003c/h2>\n\u003cp>Una inasistencia no es lo mismo que una cancelación tardía. Hay inasistencia cuando no te presentas a la consulta sin haber avisado antes de la hora de inicio. Un aviso dado con menos de 24 horas, pero antes de la hora de inicio, es una cancelación tardía y se rige por la sección E.\u003c/p>\n\u003cp>\u003cb>Política de inasistencias:\u003c/b> \u003cspan class=\"ph\">[Política de inasistencias]\u003c/span>\u003c/p>\n\u003ch2>G. Atención en línea\u003c/h2>\n\u003cul>\u003cli>\u003cb>Plataforma:\u003c/b> las sesiones se realizan por google meet; te enviaré el enlace por Whatsapp.\u003c/li>\u003cli>\u003cb>Privacidad del espacio:\u003c/b> conéctate desde un lugar privado donde nadie pueda escuchar, de preferencia con audífonos. Yo haré lo mismo.\u003c/li>\u003cli>\u003cb>Ubicación:\u003c/b> al inicio de cada sesión te preguntaré en qué lugar te encuentras, para poder pedir ayuda en caso de emergencia.\u003c/li>\u003cli>\u003cb>Grabaciones:\u003c/b> ninguna de las dos partes grabará las sesiones sin autorización previa y por escrito de la otra.\u003c/li>\u003cli>\u003cb>Conexión:\u003c/b> procura una conexión estable. Si la llamada se corta, intentaré reconectar y, si no es posible, te llamaré al teléfono registrado. Si no se restablece en 10 minutos: se reagenda\u003c/li>\u003cli>\u003cb>Interrupciones:\u003c/b> si alguien entra al espacio o hay una interrupción, podemos pausar la sesión.\u003c/li>\u003cli>\u003cb>Seguridad:\u003c/b> no tomes la sesión mientras manejas o realizas otra actividad que requiera tu atención.\u003c/li>\u003cli>\u003cb>Límites:\u003c/b> si considero que la modalidad en línea no es adecuada para tu situación, te propondré sesiones presenciales u otra alternativa.\u003c/li>\u003c/ul>\n\u003ch2>H. Tus derechos\u003c/h2>\n\u003cul>\u003cli>Recibir información clara sobre el proceso, sus objetivos, la forma de trabajo y los costos.\u003c/li>\u003cli>Hacer preguntas en cualquier momento.\u003c/li>\u003cli>Expresar dudas o desacuerdos sin que eso afecte la atención que recibes.\u003c/li>\u003cli>Solicitar información sobre cómo trato tus datos personales y ejercer tus derechos de acceso, rectificación, cancelación y oposición, como explica el aviso de privacidad.\u003c/li>\u003cli>Retirar tu consentimiento. Para el tratamiento de tus datos, la revocación no tiene efectos hacia atrás. Tu expediente debe conservarse al menos cinco años después de la última atención, por lo que retirar el consentimiento no implica borrarlo antes de ese plazo.\u003c/li>\u003cli>Interrumpir el proceso en cualquier momento. Los cargos ya generados conforme a la sección E se mantienen.\u003c/li>\u003cli>Solicitar por escrito un resumen clínico.\u003c/li>\u003cli>Pedir que te recomiende a otra u otro profesional.\u003c/li>\u003cli>Recibir un trato digno, respetuoso y sin discriminación.\u003c/li>\u003c/ul>\n\u003ch2>I. Aceptación y firmas\u003c/h2>\n\u003cp>Declaro que leí este documento, que me fue explicado, que tuve oportunidad de hacer preguntas y que acepto iniciar el proceso psicoterapéutico en los términos aquí descritos, incluida la política de cancelaciones. Recibí una copia de este documento.\u003c/p>\n\u003cp>\u003cb>Firma electrónica.\u003c/b> Se registra al final de este formulario con tu nombre escrito, la fecha y la hora de tu aceptación.\u003c/p>\n\u003cp>No aplica: el registro a distancia es solo para personas adultas.\u003c/p>\n\u003cp>Expediente [se asigna al registrarte]. Documento generado el 24/11/2026 12:58.\u003c/p>"},{"id":"constancia","titulo":"Constancia de consentimiento para datos personales sensibles","version":1,"md":"# Constancia de consentimiento expreso para datos personales sensibles\n\nYo, **[tu nombre completo, como lo escribas al firmar]**, con expediente **[se asigna al registrarte]**, manifiesto que Mariana Pérez Monjiote puso a mi disposición su aviso de privacidad integral y que lo conozco.\n\nOtorgo mi consentimiento expreso para que trate mis datos personales sensibles, en particular los relativos a mi estado de salud física y mental, para las finalidades descritas en dicho aviso.\n\n[ ] Ratifico el consentimiento que otorgué de forma electrónica en el formulario de registro el día 24/11/2026.\n\n## Autorización opcional para compartir información con otro profesional\n\n| Nombre y profesión de quien recibirá la información | [[firma]] |\n| Información que se puede compartir | [[firma]] |\n| Finalidad | |\n| Vigencia de la autorización | |\n\n**Firma electrónica.** Se registra al final de este formulario con tu nombre escrito, la fecha y la hora de tu aceptación.\n\nExpediente [se asigna al registrarte]. Documento generado el 24/11/2026 12:58.","hash":"ae886bba8b5065e0de563d5e96a8332ccd9ccc696ba97b9f2629280f4eaf3409","html":"\u003ch1>Constancia de consentimiento expreso para datos personales sensibles\u003c/h1>\n\u003cp>Yo, \u003cb>[tu nombre completo, como lo escribas al firmar]\u003c/b>, con expediente \u003cb>[se asigna al registrarte]\u003c/b>, manifiesto que Mariana Pérez Monjiote puso a mi disposición su aviso de privacidad integral y que lo conozco.\u003c/p>\n\u003cp>Otor
